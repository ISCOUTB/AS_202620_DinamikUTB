name: Deploy frontend (GitHub Pages)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # Recomendado: fijar cada action por SHA como en ci.yml (hotspot de Sonar).
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get --enforce-lockfile

      - name: Build web
        run: >
          flutter build web --release
          --base-href /AS_202620_DinamikUTB/
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://dinamikutb-api.onrender.com' }}

      # Fallback de SPA en GitHub Pages
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
