[project]
name = "dinamikutb-backend"
version = "0.2.0"
description = "Backend de DinamikUTB"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx2",
    "pytest",
    "pytest-cov",
    "sqlalchemy",
    "psycopg[binary]",
    "argon2-cffi",
    "pyjwt",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
