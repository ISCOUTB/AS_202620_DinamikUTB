name: frontend
description: "DinamikUTB — seguimiento de requisitos de grado."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.2.0
  provider: ^6.1.2
  flutter_secure_storage: ^11.2.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/characters_hero.png

  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 800
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
