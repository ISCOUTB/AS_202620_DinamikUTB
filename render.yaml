# Define el servicio backend y la base de datos que Render debe crear.
databases:
  - name: dinamikutb-db
    plan: free
    databaseName: dinamikutb
    user: dinamikutb

services:
  - type: web
    name: dinamikutb-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Carga los datos de ejemplo antes de iniciar la API.
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL          # Render proporciona esta variable.
        fromDatabase:
          name: dinamikutb-db
          property: connectionString
      - key: CORS_ORIGINS          # Origen de GitHub Pages, sin ruta.
        value: https://iscoutb.github.io
