name: Deploy frontend (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - run: flutter pub get --enforce-lockfile

      - name: Validate API base URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api-dinamikutb.iscoutb.dev' }}
        run: |
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "API_BASE_URL must use HTTPS."
            exit 1
          fi

      - name: Build web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api-dinamikutb.iscoutb.dev' }}
        run: >
          flutter build web --release
          --base-href /AS_202620_DinamikUTB/
          --dart-define=API_BASE_URL=$API_BASE_URL

      # GitHub Pages sirve este archivo para rutas no encontradas y la app muestra su 404.
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/build/web

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
