# deploy/compose.lab.yaml — infraestructura como código del sistema en el servidor del laboratorio.
#
# GitHub Actions construye y publica la imagen del frontend en GHCR. Dokploy
# construye la API y descarga la imagen estática del frontend.
#
# Reglas del laboratorio (docs/politicas-uso.md):
#   - Sin "ports:": Traefik enruta el tráfico público; usa "expose".
#   - Sin bind mounts, docker.sock ni privileged: solo volúmenes con nombre.
#   - Sin container_name ni redes externas (Isolated Deployment crea la red del equipo).
#   - Límites en cada servicio: el total del equipo no pasa de 512 MB.
#   - Secretos en Dokploy → Environment. Aquí solo se referencian con ${VARIABLE}.

services:
  api:
    build:
      context: ../backend          # carpeta con el Dockerfile de la API
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:?define CORS_ORIGINS}
      LOG_FORMAT: json
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?define SEED_DEMO_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Parámetros de memoria acordes al límite de 160 MB.
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "effective_cache_size=96MB",
              "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 160M

  web:
    image: ${FRONTEND_IMAGE:?define FRONTEND_IMAGE}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # Broker de mensajes (semana 12). Elige UNO. Kafka no está permitido en el laboratorio.
