name: Publish frontend image

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/publish-frontend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-image
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish Flutter frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate API base URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [[ -z "$API_BASE_URL" ]]; then
            echo "Configure the API_BASE_URL repository variable before publishing."
            exit 1
          fi
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "API_BASE_URL must use HTTPS."
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/iscoutb/as_202620_dinamikutb-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and publish frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            API_BASE_URL=${{ vars.API_BASE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
