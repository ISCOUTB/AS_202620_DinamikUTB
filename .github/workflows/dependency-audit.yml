name: Auditoría de dependencias

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # lunes, semanal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pip-audit
        run: python -m pip install pip-audit
      - name: Auditar dependencias del backend
        run: pip-audit -r backend/requirements.txt
